spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DB_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080


exchange:
  server:
    jar-path: ${EXCHANGE_SERVER_JAR_PATH:exchange/build/libs/exchange-0.0.1-SNAPSHOT.jar}
    host: ${EXCHANGE_SERVER_HOST:localhost}
    port: ${EXCHANGE_SERVER_PORT:8081}



jwt:
  secret-key: ${JWT_SECRET_KEY:mySuperSecretKey1ADADASDASDADASDASDADASDASDASD23!}
  access-token-expired-at: ${ACCESS_TOKEN_EXPIRED_AT:5}
  refresh-token-expired-at: ${REFRESH_TOKEN_EXPIRED_AT:7}

aes:
  secret-key: ${AES_SECRET_KEY}